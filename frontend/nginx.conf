map "$request_uri $uri" $logged_uri {
    "~*(^| )/(?:api/v1/)?pickup(?:/|\?| |$)" /pickup/[redacted];
    "~*(^| )/api/v1/transfer-imports(?:/|\?| |$)" /transfer-imports/[redacted];
    default $uri;
}

log_format toolbox '$remote_addr [$time_local] "$request_method $logged_uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log toolbox;
    client_max_body_size 52m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Retired personal device space and its import endpoints.
    location ~ ^/api/v1/(device-items(?:/|$)|transfer-imports(?:/|$)|groups/[^/]+/files/import-device(?:/|$)) {
        return 410;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = /index.html {
        expires -1;
    }

    location ~* "^/assets/.+-[a-zA-Z0-9_-]{8,}\.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
